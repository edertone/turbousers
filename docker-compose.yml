
services:
  db:
    image: postgres:16-alpine
    container_name: usersvc-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-usersvc}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-usersvc_password}
      - POSTGRES_DB=${POSTGRES_DB:-usersvc}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
          - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-usersvc} -d ${POSTGRES_DB:-usersvc}']
      interval: 5s
      timeout: 5s
      retries: 10
      # Cover the longer first-time initialization of a fresh data directory.
      start_period: 60s

  app:
    build:
      context: .
    container_name: usersvc-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-usersvc}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-usersvc_password}
      - POSTGRES_DB=${POSTGRES_DB:-usersvc}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-usersvc}:${POSTGRES_PASSWORD:-usersvc_password}@db:5432/${POSTGRES_DB:-usersvc}?schema=public
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-change_me_access_secret}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change_me_refresh_secret}
      - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:-admin}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-admin123}
      - DASHBOARD_SECRET=${DASHBOARD_SECRET:-change_me_dashboard_secret}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@usersvc.local}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-admin123}
      - SEED_DEMO_USERS=${SEED_DEMO_USERS:-true}
    ports:
          - '${PORT:-3000}:3000'
